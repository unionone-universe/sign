<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>전자서명 관리 · UNION ONE</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <img src="logo.png" alt="UNION ONE">
      <span class="brand-divider"></span>
      <span class="brand-label">E-SIGN ADMIN</span>
    </div>
    <button class="btn sm ghost" id="btnLogout" type="button" hidden>로그아웃</button>
  </div>
</header>

<main class="container">

  <!-- 로그인 -->
  <section class="card" id="viewLogin" style="max-width:420px;margin:40px auto">
    <p class="eyebrow">ADMIN</p>
    <h1>전자서명 관리</h1>
    <div class="field">
      <label for="inPw">관리자 비밀번호</label>
      <input type="password" id="inPw" autocomplete="current-password">
    </div>
    <button class="btn primary block" id="btnLogin" type="button">로그인</button>
    <p class="error-text" id="loginError"></p>
  </section>

  <div id="viewApp" hidden>

    <!-- 새 서명 요청 -->
    <section class="card">
      <p class="eyebrow">NEW REQUEST</p>
      <h2>새 서명 요청</h2>
      <p class="sub">계약서 PDF를 올리면 “(서명 또는 인)” 위치를 자동으로 찾아 서명 자리로 지정합니다.</p>

      <label class="drop" id="drop">
        <input type="file" id="inFile" accept="application/pdf,.pdf">
        <strong id="dropTitle">계약서 PDF 선택</strong>
        <span id="dropSub">눌러서 파일을 고르세요</span>
      </label>

      <div id="newForm" hidden style="margin-top:18px">
        <div class="grid-2">
          <div class="field">
            <label for="inTitle">문서명</label>
            <input type="text" id="inTitle" maxlength="80">
          </div>
          <div class="field">
            <label for="inSigner">서명자 성명</label>
            <input type="text" id="inSigner" maxlength="40" placeholder="예) 김주혜">
            <div class="hint">서명 화면에서 이 이름과 똑같이 입력해야 서명할 수 있습니다.</div>
          </div>
        </div>

        <p class="notice" id="markInfo"></p>
        <div class="btn-row" style="margin:10px 0 0">
          <button class="btn sm ghost" id="btnPick" type="button">서명 위치 직접 지정</button>
        </div>

        <div class="viewer-head"><strong>미리보기</strong><span id="pageCount"></span></div>
        <div class="pdf-viewer" id="viewer"></div>

        <div style="margin-top:18px">
          <button class="btn primary block" id="btnCreate" type="button">서명 링크 만들기</button>
          <p class="error-text" id="createError"></p>
        </div>
      </div>

      <div class="result-box" id="resultBox" hidden>
        <p class="eyebrow">LINK CREATED</p>
        <h2 id="resultTitle"></h2>
        <div class="field" style="margin-top:12px">
          <label>서명 링크</label>
          <div class="copy-line">
            <input type="text" id="outLink" readonly>
            <button class="btn sm primary" id="btnCopyLink" type="button">복사</button>
          </div>
        </div>
        <div class="field">
          <label>카카오톡 안내 문구</label>
          <textarea id="outMsg" readonly style="min-height:150px"></textarea>
          <div class="btn-row" style="margin-top:8px">
            <button class="btn sm primary" id="btnCopyMsg" type="button">문구 복사</button>
            <a class="btn sm ghost" id="btnOpenLink" target="_blank" rel="noopener">서명 화면 열어보기</a>
            <button class="btn sm ghost" id="btnNew" type="button">새로 만들기</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 목록 -->
    <section class="card">
      <div class="section-head">
        <div>
          <p class="eyebrow">DOCUMENTS</p>
          <h2>서명 문서 목록</h2>
        </div>
        <button class="btn sm ghost" id="btnRefresh" type="button">새로고침</button>
      </div>
      <ul class="doc-list" id="docList"></ul>
      <p class="sub" id="listEmpty" hidden style="margin:12px 0 0">아직 만든 서명 요청이 없습니다.</p>
    </section>

  </div>
</main>

<footer class="site-footer">(주)유니온 원 · UNION ONE e-Sign</footer>

<script src="lib/pdf.min.js"></script>
<script src="common.js"></script>
<script>
(function () {
  'use strict';
  var $ = UO.$;
  var KEY = 'uo-sign-admin';
  var pw = '';
  var file = null;       // { bytes, name }
  var render = null;     // renderPdf 결과
  var sigBox = null;
  var picking = false;

  function store(v) {
    try { if (v) sessionStorage.setItem(KEY, v); else sessionStorage.removeItem(KEY); } catch (e) {}
  }
  function stored() {
    try { return sessionStorage.getItem(KEY) || ''; } catch (e) { return ''; }
  }

  function signBase() { return new URL('./', location.href).href; }
  function linkOf(token) { return signBase() + '?t=' + token; }
  function messageOf(title, signer, link) {
    return '[UNION ONE] ' + signer + ' 님, 안녕하세요. (주)유니온 원입니다.\n' +
      '「' + title + '」 전자서명을 요청드립니다.\n' +
      '아래 링크에서 계약서 내용을 확인하신 뒤 서명 부탁드립니다.\n\n' + link;
  }

  /* ---------------- 로그인 ---------------- */
  function login(value, silent) {
    $('#loginError').textContent = '';
    $('#btnLogin').disabled = true;
    return UO.api('admin.login', { pw: value })
      .then(function () {
        pw = value;
        store(value);
        $('#viewLogin').hidden = true;
        $('#viewApp').hidden = false;
        $('#btnLogout').hidden = false;
        loadList();
      })
      .catch(function (e) {
        store('');
        if (!silent) $('#loginError').textContent = e.message;
      })
      .then(function () { $('#btnLogin').disabled = false; });
  }

  /* ---------------- 파일 선택 ---------------- */
  function onFile(f) {
    if (!f) return;
    if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf') { UO.toast('PDF 파일만 올릴 수 있습니다.'); return; }
    UO.busy('계약서를 읽고 있습니다');
    f.arrayBuffer().then(function (buf) {
      file = { bytes: new Uint8Array(buf), name: f.name };
      $('#dropTitle').textContent = f.name;
      $('#dropSub').textContent = '다른 파일을 고르려면 다시 누르세요';
      $('#inTitle').value = f.name.replace(/\.pdf$/i, '').replace(/[_]+/g, ' ').trim();
      $('#newForm').hidden = false;
      $('#resultBox').hidden = true;
      return UO.renderPdf($('#viewer'), file.bytes);
    }).then(function (res) {
      render = res;
      $('#pageCount').textContent = '총 ' + res.pages.length + '쪽';
      bindPick();
      return UO.findMarker(res.pdf, ['(서명 또는 인)', '(서명)', '(인)']);
    }).then(function (box) {
      UO.busy(null);
      if (box) {
        setBox(box, '자동으로 찾은 위치');
      } else {
        sigBox = null;
        $('#markInfo').textContent = '서명 위치 표시 문구를 찾지 못했습니다. “서명 위치 직접 지정”을 누른 뒤 미리보기에서 서명할 곳을 눌러 주세요.';
      }
    }).catch(function (e) {
      UO.busy(null);
      UO.toast('PDF를 읽지 못했습니다: ' + e.message);
    });
  }

  function setBox(box, how) {
    sigBox = box;
    var pi = render.pages[box.page];
    render.pages.forEach(function (p) { var m = p.wrap.querySelector('.sig-mark'); if (m) m.remove(); });
    var el = UO.drawMark(pi, box);
    $('#markInfo').textContent = '서명 위치: ' + (box.page + 1) + '쪽 (' + how + '). 위치가 다르면 “서명 위치 직접 지정”으로 바꿀 수 있습니다.';
    if (how !== '자동으로 찾은 위치') el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function bindPick() {
    render.pages.forEach(function (p) {
      p.wrap.addEventListener('click', function (e) {
        if (!picking) return;
        var r = p.wrap.getBoundingClientRect();
        var sx = (e.clientX - r.left) / r.width * p.cssViewport.width;
        var sy = (e.clientY - r.top) / r.height * p.cssViewport.height;
        var pt = p.cssViewport.convertToPdfPoint(sx, sy);
        var w = 70, h = 16;
        setBox({ page: p.index, x: pt[0] - w / 2, y: pt[1] - h / 2, w: w, h: h }, '직접 지정');
        picking = false;
        $('#viewer').classList.remove('pick-mode');
        $('#btnPick').textContent = '서명 위치 직접 지정';
      });
    });
  }

  /* ---------------- 만들기 ---------------- */
  function create() {
    var err = $('#createError');
    err.textContent = '';
    var title = $('#inTitle').value.trim();
    var signer = $('#inSigner').value.trim();
    if (!file) { err.textContent = '계약서 PDF를 선택해 주세요.'; return; }
    if (!title) { err.textContent = '문서명을 입력해 주세요.'; return; }
    if (!signer) { err.textContent = '서명자 성명을 입력해 주세요.'; return; }
    if (!sigBox) { err.textContent = '서명 위치를 지정해 주세요.'; return; }

    $('#btnCreate').disabled = true;
    UO.busy('서명 링크를 만들고 있습니다');
    UO.bytesToB64(file.bytes)
      .then(function (b64) {
        return UO.api('admin.create', {
          pw: pw, title: title, signerName: signer, fileName: file.name, pdf: b64,
          sigBox: { page: sigBox.page, x: round(sigBox.x), y: round(sigBox.y), w: round(sigBox.w), h: round(sigBox.h) },
        });
      })
      .then(function (r) {
        UO.busy(null);
        var link = linkOf(r.token);
        $('#resultTitle').textContent = r.docNo + ' · ' + title;
        $('#outLink').value = link;
        $('#outMsg').value = messageOf(title, signer, link);
        $('#btnOpenLink').href = link;
        $('#newForm').hidden = true;
        $('#resultBox').hidden = false;
        $('#resultBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
        loadList();
      })
      .catch(function (e) { UO.busy(null); err.textContent = e.message; })
      .then(function () { $('#btnCreate').disabled = false; });
  }
  function round(n) { return Math.round(n * 100) / 100; }

  function resetNew() {
    file = null; render = null; sigBox = null;
    $('#inFile').value = '';
    $('#dropTitle').textContent = '계약서 PDF 선택';
    $('#dropSub').textContent = '눌러서 파일을 고르세요';
    $('#inTitle').value = '';
    $('#inSigner').value = '';
    $('#viewer').innerHTML = '';
    $('#newForm').hidden = true;
    $('#resultBox').hidden = true;
  }

  /* ---------------- 목록 ---------------- */
  function badge(status) {
    var cls = status === '완료' ? 'badge solid' : status === '취소' ? 'badge muted' : 'badge';
    return '<span class="' + cls + '">' + UO.esc(status) + '</span>';
  }

  function loadList() {
    var ul = $('#docList');
    ul.innerHTML = '<li class="doc-item"><span class="doc-sub">불러오는 중…</span></li>';
    UO.api('admin.list', { pw: pw }).then(function (r) {
      ul.innerHTML = '';
      $('#listEmpty').hidden = r.rows.length > 0;
      r.rows.forEach(function (d) {
        var li = document.createElement('li');
        li.className = 'doc-item';
        var when = d.status === '완료' ? '서명 ' + d.signedAt : '요청 ' + d.createdAt;
        li.innerHTML =
          '<div><div class="doc-title">' + UO.esc(d.title) + '</div>' +
          '<div class="doc-sub">' + UO.esc(d.docNo) + ' · 서명자 ' + UO.esc(d.signerName) + ' · ' + UO.esc(when) + '</div></div>' +
          '<div>' + badge(d.status) + '</div>' +
          '<div class="doc-actions"></div>';
        var act = li.querySelector('.doc-actions');
        if (d.status === '대기' || d.status === '처리중') {
          act.appendChild(btn('링크 복사', 'primary', function () { UO.copyText(linkOf(d.token)); }));
          act.appendChild(btn('안내 문구 복사', 'ghost', function () { UO.copyText(messageOf(d.title, d.signerName, linkOf(d.token))); }));
        }
        if (d.signedUrl) act.appendChild(link('완료본 열기', d.signedUrl));
        if (d.folderUrl) act.appendChild(link('보관 폴더', d.folderUrl));
        if (d.status === '대기') {
          act.appendChild(btn('요청 취소', 'danger', function () { cancel(d); }));
        }
        ul.appendChild(li);
      });
    }).catch(function (e) {
      ul.innerHTML = '';
      UO.toast(e.message);
      if (/비밀번호/.test(e.message)) logout();
    });
  }

  function btn(text, kind, fn) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn sm ' + kind;
    b.textContent = text;
    b.addEventListener('click', fn);
    return b;
  }
  function link(text, href) {
    var a = document.createElement('a');
    a.className = 'btn sm ghost';
    a.textContent = text;
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener';
    return a;
  }

  function cancel(d) {
    var ok = true;
    try { ok = window.confirm('「' + d.title + '」 서명 요청을 취소할까요? 취소하면 링크로 서명할 수 없습니다.'); } catch (e) {}
    if (!ok) return;
    UO.busy('취소하고 있습니다');
    UO.api('admin.cancel', { pw: pw, docNo: d.docNo })
      .then(function () { UO.busy(null); UO.toast('취소했습니다.'); loadList(); })
      .catch(function (e) { UO.busy(null); UO.toast(e.message); });
  }

  function logout() {
    pw = '';
    store('');
    $('#viewApp').hidden = true;
    $('#viewLogin').hidden = false;
    $('#btnLogout').hidden = true;
    $('#inPw').value = '';
  }

  /* ---------------- 이벤트 ---------------- */
  $('#btnLogin').addEventListener('click', function () { login($('#inPw').value); });
  $('#inPw').addEventListener('keydown', function (e) { if (e.key === 'Enter') login($('#inPw').value); });
  $('#btnLogout').addEventListener('click', logout);
  $('#inFile').addEventListener('change', function (e) { onFile(e.target.files[0]); });
  $('#btnPick').addEventListener('click', function () {
    if (!render) return;
    picking = !picking;
    $('#viewer').classList.toggle('pick-mode', picking);
    $('#btnPick').textContent = picking ? '미리보기에서 서명할 곳을 누르세요 (취소)' : '서명 위치 직접 지정';
    if (picking) UO.toast('미리보기에서 서명할 곳을 눌러 주세요.');
  });
  $('#btnCreate').addEventListener('click', create);
  $('#btnCopyLink').addEventListener('click', function () { UO.copyText($('#outLink').value); });
  $('#btnCopyMsg').addEventListener('click', function () { UO.copyText($('#outMsg').value); });
  $('#btnNew').addEventListener('click', resetNew);
  $('#btnRefresh').addEventListener('click', loadList);

  var saved = stored();
  if (saved) login(saved, true);
})();
</script>
</body>
</html>
